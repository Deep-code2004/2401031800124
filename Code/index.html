<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Virtual Reality Travel Experience</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" integrity="sha384-9ndCyUa6Y/xS0+Yk4hiB7QWmPduLcGx8em4RcXE6MnFVlowerQGsb31Z/4IKT8t6" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header class="bg-dark text-light py-4 mb-5">
      <div class="container text-center">
        <h1 class="display-5 fw-bold">Virtual Reality Travel Experience</h1>
        <p class="lead">Explore top destinations through immersive VR tours and interactive guides.</p>
        <div class="input-group mt-3 w-75 mx-auto">
          <span class="input-group-text" id="search-label">🔍</span>
          <input id="searchInput" type="text" class="form-control" placeholder="Search destination (Paris, Maldives, Tokyo...)" aria-label="Search" aria-describedby="search-label">
        </div>
      </div>
    </header>

    <main class="container">
      <div id="destinationsRow" class="row g-4"></div>
    </main>

    <footer class="text-muted text-center py-4 mt-5 border-top">
      <div class="container">Built with HTML, CSS, JavaScript, jQuery, Bootstrap.</div>
    </footer>

    <!-- VR Tour Modal -->
    <div class="modal fade" id="vrModal" tabindex="-1" aria-labelledby="vrModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="vrModalLabel">VR Tour</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="ratio ratio-16x9 mb-3" id="videoContainer">
              <iframe id="vrVideo" src="" title="VR Tour Video" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
            </div>
            <p id="vrDescription" class="lead"></p>
            <ul id="vrFeatures" class="list-group"></ul>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <a id="exploreLink" href="#" target="_blank" class="btn btn-primary">Open Full VR Experience</a>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js" integrity="sha256-3fpV/yvHO0WnQklFNTbQN6HkQJXjMXTnP1ptsKp4LhU=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+HLvI2/modi6u40ruR+5aMRyX0ycJ" crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
  </body>
</html>
